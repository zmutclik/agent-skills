# PR otomatis untuk versi baru: uv.lock (Python), base image Dockerfile, dan GitHub Actions (SHA ikut diperbarui).
# Setiap PR melewati CI (test di MariaDB asli + pip-audit) sebelum di-merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    groups:
      python-minor-patch:
        update-types: [minor, patch]   # satu PR untuk semua minor/patch; major tetap PR terpisah
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
