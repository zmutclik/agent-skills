# Production-like stack. TLS diterminasi di depan nginx (load balancer / Caddy / certbot).
# Database: MariaDB eksternal lewat DATABASE_URL di .env (tidak ada container db).
# Migrasi: jalankan manual sekali per deploy SEBELUM `up`:
#   docker compose run --rm web alembic upgrade head
# Driver log default Docker (json-file) tanpa batas: log memenuhi disk. Pasang di setiap service (termasuk worker).
x-logging: &default-logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  web:
    build: .
    env_file: .env
    environment:
      # Hanya proxy di network internal yang dipercaya. Jangan "*": uvicorn lalu mengambil entri X-Forwarded-For
      # PALING KIRI, yang bisa diisi client → IP palsu menembus rate limit login per-IP.
      FORWARDED_ALLOW_IPS: "${APP_SUBNET:-172.30.0.0/24}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/srv/static:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    logging: *default-logging

networks:
  default:
    ipam:
      config:
        - subnet: "${APP_SUBNET:-172.30.0.0/24}"   # subnet tetap = nilai FORWARDED_ALLOW_IPS; ganti bila bentrok
