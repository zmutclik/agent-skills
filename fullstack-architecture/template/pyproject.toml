[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",              # Depends(scope="function")
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.10",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "tzdata>=2024.1",              # zoneinfo untuk DISPLAY_TIMEZONE; image slim tidak menjamin /usr/share/zoneinfo
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.12"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "B"]   # error sintaks, nama tak terdefinisi/impor tak terpakai, bug umum

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Engine async terikat ke event loop tempat koneksi dibuat: semua test & fixture memakai satu loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
